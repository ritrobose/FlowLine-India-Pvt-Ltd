<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background -->
  <rect width="100" height="100" fill="#000000"/>
  
  <g transform="translate(50,50)" fill="#ffffff">
    <!-- Center Hub -->
    <circle cx="0" cy="0" r="7"/>
    
    <!-- 5 Blades rotated around center -->
    <!-- Blade 1 (0 deg) -->
    <path d="M 0,-7 C -6,-15 -14,-22 -8,-32 C -4,-38 8,-36 12,-26 C 15,-18 7,-12 0,-7 Z" />
    
    <!-- Blade 2 (72 deg) -->
    <path d="M 0,-7 C -6,-15 -14,-22 -8,-32 C -4,-38 8,-36 12,-26 C 15,-18 7,-12 0,-7 Z" transform="rotate(72)" />
    
    <!-- Blade 3 (144 deg) -->
    <path d="M 0,-7 C -6,-15 -14,-22 -8,-32 C -4,-38 8,-36 12,-26 C 15,-18 7,-12 0,-7 Z" transform="rotate(144)" />
    
    <!-- Blade 4 (216 deg) -->
    <path d="M 0,-7 C -6,-15 -14,-22 -8,-32 C -4,-38 8,-36 12,-26 C 15,-18 7,-12 0,-7 Z" transform="rotate(216)" />
    
    <!-- Blade 5 (288 deg) -->
    <path d="M 0,-7 C -6,-15 -14,-22 -8,-32 C -4,-38 8,-36 12,-26 C 15,-18 7,-12 0,-7 Z" transform="rotate(288)" />
  </g>
</svg>